name: Build and Publish Docker Image

# Run whenever you push to these branches, or trigger manually from the Actions tab.
on:
  push:
    branches:
      - main
      - develop
      - feature/final-project
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU lets us build images for CPU architectures other than the runner's.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx is required for multi-platform builds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Credentials come from GitHub Secrets — never hardcoded.
      # Add these in: Repo > Settings > Secrets and variables > Actions
      #   DOCKERHUB_USERNAME  -> your Docker Hub username
      #   DOCKERHUB_TOKEN     -> a Docker Hub access token (not your password)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build for amd64 + arm64. This single multi-platform image runs on
      # Windows, macOS (Intel & Apple Silicon), and Linux via Docker Desktop.
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dvop400-finalproject:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dvop400-finalproject:${{ github.sha }}
